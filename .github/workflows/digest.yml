name: Neuro Digest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'digest — полный дайджест; telegram-test — тест доставки'
        type: choice
        options:
          - digest
          - telegram-test
        default: digest
  schedule:
    # Moscow is UTC+3 throughout the year.
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/digest.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: neuro-digest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m py_compile main.py
      - run: python -m unittest discover -s tests -v

  send:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash-lite' }}
      GEMINI_FREE_TIER: ${{ vars.GEMINI_FREE_TIER || 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test Telegram delivery
        if: github.event_name == 'push' || inputs.mode == 'telegram-test'
        run: python main.py --test-telegram
      - name: Send digest
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'telegram-test')
        run: python main.py
